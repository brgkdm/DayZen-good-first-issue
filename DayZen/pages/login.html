<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - DayZen</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>
<div class="container">

    <div class="logo">
        <img src="../assets/images/logos/logo.png" alt="DayZen Logo">
        <span class="logo-name">DayZen</span>
    </div>

    <h2 class="welcome-message">Welcome Back!</h2>
    <p class="welcome-sub">Sign in to continue to your dashboard.</p>

    <div class="error-box" id="errorBox"></div>

    <form id="loginForm" novalidate>

        <div class="field">
            <label for="identifier">Username, email or phone</label>
            <div class="input-wrap">
                <input type="text" id="username" placeholder="Username, email or phone" name="identifier" required>
            </div>
        </div>

        <div class="field">
            <label for="password">Password</label>
            <div class="input-wrap">
                <input type="password" id="password" name="password"
                       placeholder="Your password" required>
                <button type="button" class="toggle-pw" id="togglePw" aria-label="Show password">
                    <span id="eyeIcon">&#128065;</span>
                </button>
            </div>
        </div>

        <button type="submit" id="loginBtn">login</button>

    </form>

    <div class="divider"><span>or continue with</span></div>

    <div class="social-buttons">
        <button class="social-btn" type="button" onclick="alert('Google OAuth coming soon!')">

                <path fill="#4CAF50" d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238A11.91 11.91 0 0 1 24 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z"/>
                <path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303a12.04 12.04 0 0 1-4.087 5.571l.003-.002 6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z"/>
            </svg>
            Continue with Google
        </button>
