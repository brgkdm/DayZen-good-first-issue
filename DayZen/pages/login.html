<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - DayZen</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, #a8dadc, #238db5);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }

        .container {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.12), 0 2px 8px rgba(0,0,0,0.06);
            padding: 2.5rem 2rem;
            width: 100%;
            max-width: 400px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 1.75rem;
        }
        .logo img { width: 40px; height: 40px; object-fit: contain; }
        .logo-name { font-size: 18px; font-weight: 700; color: #1a1a2e; letter-spacing: -0.3px; }

        .welcome-message { font-size: 22px; font-weight: 700; color: #1a1a2e; margin-bottom: 4px; }
        .welcome-sub { font-size: 13px; color: #7a8494; margin-bottom: 1.75rem; }

        .field { margin-bottom: 1rem; }
        .field label {
            display: block; font-size: 11px; font-weight: 600;
            color: #7a8494; text-transform: uppercase; letter-spacing: 0.7px; margin-bottom: 6px;
        }
        .input-wrap { position: relative; }
        .input-wrap input {
            width: 100%; background: #f7f9fc;
            border: 1.5px solid #e2e8f0; border-radius: 8px;
            color: #1a1a2e; font-family: 'Outfit', sans-serif;
            font-size: 15px; padding: 11px 42px 11px 14px;
            outline: none; transition: border-color 0.2s, background 0.2s;
        }
        .input-wrap input::placeholder { color: #b0bac6; font-size: 13px; }
        .input-wrap input:focus { border-color: #2891b7; background: #fff; }

        .toggle-pw {
            position: absolute; right: 11px; top: 50%; transform: translateY(-50%);
            background: none; border: none; cursor: pointer;
            font-size: 16px; color: #b0bac6; padding: 0;
            display: flex; align-items: center; transition: color 0.2s;
        }
        .toggle-pw:hover { color: #2891b7; }

        /* Error box */
        .error-box {
            background: #fff5f5; border: 1px solid #fed7d7;
            border-radius: 8px; padding: 10px 14px;
            font-size: 13px; color: #c53030;
            margin-bottom: 1rem; display: none;
        }

        #loginBtn {
            width: 100%; background: #2891b7; color: #fff;
            border: none; border-radius: 8px;
            font-family: 'Outfit', sans-serif; font-size: 15px; font-weight: 600;
            padding: 12px; cursor: pointer; margin-top: 0.5rem;
            transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
            box-shadow: 0 2px 8px rgba(40,145,183,0.35);
        }
        #loginBtn:hover { background: #1e7aa0; box-shadow: 0 4px 14px rgba(40,145,183,0.45); }
        #loginBtn:active { transform: scale(0.98); }

        .divider { display: flex; align-items: center; gap: 12px; margin: 1.25rem 0; }
        .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: #e2e8f0; }
        .divider span { font-size: 12px; color: #b0bac6; white-space: nowrap; }

        .social-buttons { display: flex; flex-direction: column; gap: 10px; }
        .social-btn {
            width: 100%; background: #fff; border: 1.5px solid #e2e8f0; border-radius: 8px;
            color: #1a1a2e; font-family: 'Outfit', sans-serif; font-size: 14px; font-weight: 500;
            padding: 10px 14px; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            transition: background 0.18s, border-color 0.18s, transform 0.1s;
        }
        .social-btn:hover { background: #f7f9fc; border-color: #2891b7; }
        .social-btn:active { transform: scale(0.98); }

        .register-link { text-align: center; font-size: 13px; color: #7a8494; margin-top: 1.25rem; }
        .register-link a { color: #2891b7; text-decoration: none; font-weight: 600; }
        .register-link a:hover { text-decoration: underline; }

        @media (max-width: 480px) {
            .container { padding: 2rem 1.25rem; }
            .welcome-message { font-size: 20px; }
        }
    </style>
</head>
<body>
<div class="container">

    <div class="logo">
        <img src="../assets/images/logos/logo.png" alt="DayZen Logo">
        <span class="logo-name">DayZen</span>
    </div>

    <h2 class="welcome-message">Welcome Back!</h2>
    <p class="welcome-sub">Sign in to continue to your dashboard.</p>

    <div class="error-box" id="errorBox"></div>

    <form id="loginForm" novalidate>

        <div class="field">
            <label for="identifier">Username, email or phone</label>
            <div class="input-wrap">
                <input type="text" id="username" placeholder="Username, email or phone" name="identifier" required>
            </div>
        </div>

        <div class="field">
            <label for="password">Password</label>
            <div class="input-wrap">
                <input type="password" id="password" name="password"
                       placeholder="Your password" required>
                <button type="button" class="toggle-pw" id="togglePw" aria-label="Show password">
                    <span id="eyeIcon">&#128065;</span>
                </button>
            </div>
        </div>

        <button type="submit" id="loginBtn">login</button>

    </form>

    <div class="divider"><span>or continue with</span></div>

    <div class="social-buttons">
        <button class="social-btn" type="button" onclick="alert('Google OAuth coming soon!')">
            <svg width="18" height="18" viewBox="0 0 48 48">
                <path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"/>
                <path fill="#FF3D00" d="m6.306 14.691 6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 16.318 4 9.656 8.337 6.306 14.691z"/>
                <path fill="#4CAF50" d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238A11.91 11.91 0 0 1 24 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z"/>
                <path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303a12.04 12.04 0 0 1-4.087 5.571l.003-.002 6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z"/>
            </svg>
            Continue with Google
        </button>
        <button class="social-btn" type="button" onclick="alert('Apple Sign In coming soon!')">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="#1a1a2e">
                <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/>
            </svg>
            Continue with Apple
        </button>
        <button class="social-btn" type="button" onclick="alert('Facebook OAuth coming soon!')">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="#1877F2">
                <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
            </svg>
            Continue with Facebook
        </button>
    </div>

    <p class="register-link">Don't have an account? <a href="Register.html">Sign up</a></p>

</div>

<script src="../js/login-script.js"></script>
    
</body>
</html>
