<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - DayZen</title>
    <link rel="icon" type="image/x-icon" href="../assets/images/logos/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="../css/login.css">
    <link rel="stylesheet" href="../css/brand.css">
    <link rel="stylesheet" href="../css/theme.css">
</head>
<body class="light-mode">
    <div class="split-screen">
        <div class="quote-side">
            <div class="quote-overlay"></div>
            <div class="quote-container">
                <div class="quote-content">
                    <i class="fas fa-quote-left quote-icon"></i>
                    <p id="dynamic-quote" class="fade-in">"The secret of getting ahead is getting started."</p>
                    <cite id="quote-author" class="fade-in">— Mark Twain</cite>
                </div>
            </div>
        </div>
        <div class="login-side">
            <div class="login-container">
                <div class="text-center mb-4">
                    <a href="../index.html" class="login-logo">
                        <img src="../assets/images/logos/logo.png" alt="DayZen Logo" width="48">
                    </a>
                    <h1 class="mt-3">DayZen</h1>
                    <p class="text-muted">Set Your Time, Manage Your Day!</p>
                </div>
                <form id="loginForm" class="login-card">
                    <h2 class="welcome-message">Welcome Back!</h2>
                    <div class="mb-3">
                        <label for="loginEmail" class="form-label">Email</label>
                        <input type="email" id="loginEmail" class="form-control" placeholder="Enter your email" required>
                    </div>
                    <div class="mb-3">
                        <label for="loginPassword" class="form-label">Password</label>
                        <input type="password" id="loginPassword" class="form-control" placeholder="Enter your password" required>
                    </div>
                    <button type="submit" id="loginBtn" class="btn btn-login w-100 mt-3">Login</button>
                    <div id="loginError" class="alert alert-danger mt-3" style="display: none;"></div>
                    <p class="register-link mt-4 text-center">
                        Don't have an account? <a href="register.html">Sign Up</a>
                    </p>
                </form>
                <div class="text-center mt-4">
                    <a href="../index.html" class="text-decoration-none back-to-home">← Back to Home</a>
                </div>
            </div>
        </div>
    </div>
    <div class="theme-toggle-wrapper">
        <img id="theme-icon" src="../assets/images/icons/sun.png" alt="Toggle theme" width="24">
    </div>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="../js/theme-toggle.js"></script>
    <script src="../js/login.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
