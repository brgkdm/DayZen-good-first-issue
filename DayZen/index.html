<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DayZen - Daily Routine Tracker</title>
    <style>
        /* Base Styles & Variables */
        :root {
            --bg-color: #faf9f6;
            --text-color: #2d3748;
            --primary-color: #6b8e23;
            --primary-hover: #55721c;
            --card-bg: #ffffff;
            --border-color: #e2e8f0;
            --accent-color: #4a5568;
            --transition-speed: 0.3s;
        }

        /* Dark Mode Overrides */
        [data-theme="dark"] {
            --bg-color: #121212;
            --text-color: #e2e8f0;
            --card-bg: #1e1e1e;
            --border-color: #2d3748;
            --accent-color: #a0aec0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            transition: background-color var(--transition-speed), color var(--transition-speed);
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 20px;
        }

        a {
            text-decoration: none;
            color: inherit;
            transition: color var(--transition-speed);
        }

        /* Header & Navigation */
        header {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
            transition: background-color var(--transition-speed), border-color var(--transition-speed);
        }

        .nav-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary-color);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 20px;
        }

        nav ul li a:hover {
            color: var(--primary-color);
        }

        /* Theme Toggle Button */
        #theme-toggle {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all var(--transition-speed);
        }

        #theme-toggle:hover {
            background-color: var(--border-color);
        }

        /* Hero Section */
        .hero {
            padding: 80px 0;
            text-align: center;
        }

        .hero h1 {
            font-size: 2.8rem;
            margin-bottom: 20px;
            color: var(--text-color);
        }

        .hero p {
            font-size: 1.2rem;
            color: var(--accent-color);
            max-width: 600px;
            margin: 0 auto 30px;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .btn {
            padding: 12px 24px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition-speed);
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
            border: none;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-secondary {
            background-color: transparent;
            color: var(--primary-color);
            border: 2px solid var(--primary-color);
        }

        .btn-secondary:hover {
            background-color: var(--primary-color);
            color: white;
        }

        /* Progress Dashboard Section */
        .dashboard-preview {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 40px;
            margin-bottom: 60px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border-color);
            text-align: center;
            transition: background-color var(--transition-speed), border-color var(--transition-speed);
        }

        .dashboard-preview h2 {
            margin-bottom: 20px;
        }

        .progress-circle-container {
            position: relative;
            width: 150px;
            height: 150px;
            margin: 0 auto 20px;
        }

        .progress-circle {
            transform: rotate(-90deg);
        }

        .progress-circle-bg {
            fill: none;
            stroke: var(--border-color);
            stroke-width: 8;
        }

        .progress-circle-bar {
            fill: none;
            stroke: var(--primary-color);
            stroke-width: 8;
            stroke-dasharray: 440;
            stroke-dashoffset: 110; /* Represents 75% */
            stroke-linecap: round;
        }

        .progress-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.8rem;
            font-weight: 700;
        }

        .dashboard-preview p {
            margin-bottom: 20px;
            font-size: 1.1rem;
        }

        /* Features Section */
        .features {
            padding: 60px 0;
            text-align: center;
        }

        .features h2 {
            margin-bottom: 40px;
            font-size: 2rem;
        }

        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
        }

        .feature-card {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            text-align: left;
            transition: transform var(--transition-speed), background-color var(--transition-speed), border-color var(--transition-speed);
        }

        .feature-card:hover {
            transform: translateY(-5px);
        }

        .feature-card h3 {
            margin-bottom: 15px;
            color: var(--primary-color);
        }

        /* Contact Section */
        .contact {
            padding: 60px 0;
            background-color: var(--card-bg);
            border-top: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
            transition: background-color var(--transition-speed), border-color var(--transition-speed);
        }

        .contact-container {
            max-width: 600px;
            margin: 0 auto;
            text-align: center;
        }

        .contact h2 {
            margin-bottom: 30px;
            font-size: 2rem;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background-color: var(--bg-color);
            font-size: 1rem;
            color: var(--text-color);
            transition: background-color var(--transition-speed), border-color var(--transition-speed);
        }

        .form-group input:focus, .form-group textarea:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        /* Footer */
        footer {
            padding: 40px 0;
            background-color: var(--bg-color);
            font-size: 0.9rem;
            color: var(--accent-color);
            transition: background-color var(--transition-speed);
        }

        .footer-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 20px;
        }

        .footer-links {
            display: flex;
            gap: 20px;
        }

        .footer-security {
            text-align: center;
            font-size: 0.85rem;
            color: #718096;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .nav-container {
                flex-direction: column;
                gap: 15px;
            }
            .nav-actions {
                flex-direction: column;
                gap: 15px;
            }
            .hero h1 {
                font-size: 2rem;
            }
            .footer-content {
                flex-direction: column;
                text-align: center;
            }
        }
    </style>
</head>
